<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargoura Bank Testnet</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial; text-align: center; background: #8b5cf6; color: white; padding: 50px; }
        button { background: white; color: #8b5cf6; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Gargoura Bank Testnet</h1>
    <p>Validation Étape 10 Pi</p>
    <br>
    <button onclick="payer()">VALIDER ÉTAPE 10</button>
    <p id="msg"></p>

    <script>
        Pi.init({ version: "2.0", sandbox: true });

        function payer() {
            document.getElementById("msg").innerText = "Connexion au Wallet...";
            
            Pi.authenticate(['username', 'payments']).then(function(auth) {
                
                Pi.createPayment({
                    amount: 0.01,
                    memo: "Validation Etape 10",
                    metadata: {}
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        document.getElementById("msg").innerText = "Approuvé par Pi. ID: " + paymentId;
                        // TRUC : On complète direct nous-même
                        Pi.openShareDialog("Paiement effectué ! ID: " + paymentId, "");
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        document.getElementById("msg").innerText = "TERMINÉ ! TX: " + txid;
                        alert("SUCCES ! Va sur Pi Develop > Etape 10 > Start MAINTENANT");
                    },
                    onCancel: function(paymentId) {
                        document.getElementById("msg").innerText = "Annulé";
                    },
                    onError: function(error) {
                        document.getElementById("msg").innerText = "Erreur: " + error;
                    }
                });
                
            }).catch(function(error) {
                alert("Erreur: " + error);
            });
        }
    </script>
</body>
</html>
