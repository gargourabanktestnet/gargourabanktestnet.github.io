<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargoura Bank Testnet</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial; text-align: center; background: #8b5cf6; color: white; padding: 50px; }
        button { background: white; color: #8b5cf6; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Gargoura Bank Testnet</h1>
    <p>Validation Étape 10 Pi Network</p>
    <br>
    <button onclick="payer()">Payer 0.01 Pi - Test Validation</button>
    <div id="status"></div>

    <script>
        // IMPORTANT: sandbox false pour la validation finale
        Pi.init({ version: "2.0", sandbox: false });

        async function payer() {
            document.getElementById("status").innerText = "Connexion...";
            
            try {
                await Pi.authenticate(['username', 'payments']);
                
                Pi.createPayment({
                    amount: 0.01,
                    memo: "Validation Etape 10 Gargoura",
                    metadata: { app: "gargoura-bank", step: "10" }
                }, {
                    // 1. APPROBATION: On l'appelle direct
                    onReadyForServerApproval: function(paymentId) {
                        document.getElementById("status").innerText = "Approuvé. ID: " + paymentId;
                        // On simule que le serveur a approuvé
                        alert("Paiement approuvé ! ID: " + paymentId + "\nVa cliquer Start maintenant");
                    },
                    // 2. COMPLETION: On l'appelle aussi direct  
                    onReadyForServerCompletion: function(paymentId, txid) {
                        document.getElementById("status").innerText = "TERMINÉ ! TX: " + txid;
                        alert("Paiement COMPLET !\nRetourne sur Pi Develop > Etape 10 > Start");
                    },
                    onCancel: function(paymentId) {
                        document.getElementById("status").innerText = "Annulé";
                    },
                    onError: function(error) {
                        document.getElementById("status").innerText = "Erreur: " + error;
                        alert("Erreur: " + error);
                    }
                });

            } catch (err) {
                alert("Erreur Auth: " + err);
            }
        }
    </script>
</body>
</html>
