<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargoura Bank Testnet</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial; text-align: center; background: #8b5cf6; color: white; padding: 50px; }
        button { background: white; color: #8b5cf6; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Gargoura Bank Testnet</h1>
    <p>Validation Étape 10</p>
    <br>
    <button onclick="payer()">CLIQUE ICI POUR TEST</button>
    <p id="msg"></p>

    <script>
        Pi.init({ version: "2.0", sandbox: true }); // sandbox TRUE pour test

        async function payer() {
            document.getElementById("msg").innerText = "Chargement...";
            const { username } = await Pi.authenticate(['username', 'payments']);
            
            const paymentData = {
                amount: 0.01,
                memo: `Test ${username}`,
                metadata: { "validation": "etape10" }
            };

            const callbacks = {
                onReadyForServerApproval: (paymentId) => {
                    // ICI on ne fait rien, on laisse Pi gérer
                    document.getElementById("msg").innerText = "En attente validation Pi...";
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    document.getElementById("msg").innerText = "Succès ! Va sur Pi Develop";
                    alert("Parfait ! Retourne sur Pi Develop > Etape 10 > Start maintenant");
                },
                onCancel: (paymentId) => { document.getElementById("msg").innerText = "Annulé"; },
                onError: (error) => { document.getElementById("msg").innerText = "Erreur: " + error; }
            };
            Pi.createPayment(paymentData, callbacks);
        }
    </script>
</body>
</html>
