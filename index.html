<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargoura Bank Testnet</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial; text-align: center; background: #8b5cf6; color: white; padding: 50px; }
        button { background: white; color: #8b5cf6; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Gargoura Bank Testnet</h1>
    <p>Site de validation pour Pi Network</p>
    <br>
    <button onclick="payer()">Payer 0.01 Pi pour Test</button>
    <p id="msg"></p>

    <script>
        // MODE SANDBOX POUR LA VALIDATION ÉTAPE 10
        Pi.init({ version: "2.0", sandbox: true });

        async function payer() {
            document.getElementById("msg").innerText = "Connexion à Pi...";
            
            try {
                // 1. Authentifier
                const auth = await Pi.authenticate(['username', 'payments']);
                
                // 2. Créer paiement
                Pi.createPayment({
                    amount: 0.01,
                    memo: "Test Validation Gargoura",
                    metadata: {}
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        // Pour la validation Pi, on simule l'approbation
                        document.getElementById("msg").innerText = "Paiement OK. ID: " + paymentId;
                        alert("Étape 10 réussie ! Va maintenant cliquer 'Start' sur Pi Develop");
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        document.getElementById("msg").innerText = "Terminé !";
                    },
                    onCancel: function(paymentId) {
                        alert("Annulé");
                    },
                    onError: function(error) {
                        alert("Erreur: " + error);
                        document.getElementById("msg").innerText = "Erreur: " + error;
                    }
                });

            } catch (err) {
                alert("Erreur Auth: " + err);
            }
        }
    </script>
</body>
</html>
